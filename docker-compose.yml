version: '3.8'

services:
  # Frontend - React + Vite + Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agendamento-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    networks:
      - app-network
    restart: unless-stopped
    labels:
      - "com.agendamento.service=frontend"
      - "com.agendamento.version=1.0.0"

  # Backend - Node.js + Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendamento-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - API_KEY=${API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.agendamento.service=backend"
      - "com.agendamento.version=1.0.0"

networks:
  app-network:
    driver: bridge
    labels:
      - "com.agendamento.network=main"

# No volumes needed - stateless architecture
# All data is stored in external Supabase
